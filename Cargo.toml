[package]
name = "rspotify-client"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
dotenvy = "0.15"
gpui = { version = "*" }
open = "5"
rand = "0.9"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
url = "2.5"
urlencoding = "2.1"
